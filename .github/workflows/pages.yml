name: Deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html te.json stoic.json _site/ && python3 scripts/wotd.py _site/wotd.json && sed -i "s/__BUILD__/${GITHUB_SHA}/g" _site/index.html && echo "{\"build\":\"${GITHUB_SHA}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
