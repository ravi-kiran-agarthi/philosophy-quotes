<style>

section{max-width:960px;margin:0 auto;padding:1.5rem 1rem 3rem}section h2{margin-bottom:.5rem}section p{margin:0 0 .6rem;max-width:65ch}.w{font-size:1.6rem;font-weight:700}.m{color:var(--mut);font-size:.95rem}section button{margin:0 0 .6rem}section a{color:var(--ac);font-weight:700}
button,select{font:inherit;font-size:.9rem;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:.4rem .8rem;cursor:pointer}

button:hover{filter:brightness(1.12)}select{background:var(--card)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@supports(appearance:base-select){
select,::picker(select){appearance:base-select}
select{display:inline-flex;align-items:center;justify-content:space-between;inline-size:9rem;gap:.5rem;padding:.4rem .8rem;background:var(--card);border-color:var(--ac);font-weight:700}
select::picker-icon{color:var(--ac);transition:rotate .2s}
select:open::picker-icon{rotate:180deg}
::picker(select){background:var(--card);color:var(--fg);border:1px solid var(--ac);border-radius:10px;padding:.25rem;margin-top:.25rem}
option{padding:.5rem .9rem;border-radius:6px;cursor:pointer}
option:hover,option:focus-visible{background:var(--bd)}
option:checked{background:var(--bt);color:var(--bf)}
select button{all:unset;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer}option{display:flex;align-items:center;gap:.5rem}option span{font-size:1.1rem}option::checkmark{content:"\2713";margin-inline-start:.75rem}
}

.ar{display:flex;gap:.5rem;margin:.25rem 0 .75rem}.ar button{margin:0}#ask button[type=submit]{background:var(--bt);border-color:var(--bt);color:var(--bf);font-weight:700}#mic[aria-pressed=true]{border-color:var(--ac);color:var(--ac);font-weight:700}#ares ol{margin:.3rem 0;padding-left:1.3rem;max-width:65ch}

</style>

<body>
<header><h1>🌿 Philosophy Quotes</h1>
