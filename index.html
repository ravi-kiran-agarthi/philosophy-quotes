<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Philosophy Quotes</title>
<meta name="description" content="Quotes from Stoicism, Taoism, Zen Buddhism and Hindu philosophy.">
<meta name="color-scheme" content="light dark">
<script>
(function(){var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t})();
</script>
<style>
:root{--bg:#eaf3e6;--fg:#14261a;--card:#fbfef9;--mut:#3f5846;--bd:#b9d3b8;--ac:#1f6b2e;--bt:#1f6b2e;--bf:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1810;--fg:#e8f3e5;--card:#142419;--mut:#b4c9b8;--bd:#2c4a35;--ac:#8fd69b;--bt:#8fd69b;--bf:#0c1810}}
:root[data-theme=light]{--bg:#eaf3e6;--fg:#14261a;--card:#fbfef9;--mut:#3f5846;--bd:#b9d3b8;--ac:#1f6b2e;--bt:#1f6b2e;--bf:#fff}
:root[data-theme=dark]{--bg:#0c1810;--fg:#e8f3e5;--card:#142419;--mut:#b4c9b8;--bd:#2c4a35;--ac:#8fd69b;--bt:#8fd69b;--bf:#0c1810}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--card) 140%) fixed var(--bg);color:var(--fg);font:16px/1.6 Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto;padding:1rem}
h1{font-size:1.4rem;margin:0}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;max-width:960px;margin:0 auto;padding:0 1rem 2rem}
article{background:var(--card);border:1px solid var(--bd);border-radius:12px;border-left:6px solid var(--ac);padding:1.25rem;display:flex;flex-direction:column;gap:.75rem}
h2{margin:0;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
blockquote{margin:0;flex:1;font-size:1.15rem}
cite{display:block;margin-top:.5rem;font-size:.9rem;color:var(--mut)}
hr{max-width:960px;margin:0 auto;border:0;border-top:1px solid var(--bd)}
section{max-width:960px;margin:0 auto;padding:1.5rem 1rem 3rem}section h2{margin-bottom:.5rem}section p{margin:0 0 .6rem;max-width:65ch}.w{font-size:1.6rem;font-weight:700}.m{color:var(--mut);font-size:.95rem}section button{margin:0 0 .6rem}section a{color:var(--ac);font-weight:700}
button,select{font:inherit;font-size:.9rem;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:.4rem .8rem;cursor:pointer}
article button{align-self:flex-start;background:var(--bt);border-color:var(--bt);color:var(--bf);font-weight:700}
button:hover{filter:brightness(1.12)}select{background:var(--card)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@supports(appearance:base-select){
select,::picker(select){appearance:base-select}
select{display:inline-flex;align-items:center;justify-content:space-between;inline-size:9rem;gap:.5rem;padding:.4rem .8rem;background:var(--card);border-color:var(--ac);font-weight:700}
select::picker-icon{color:var(--ac);transition:rotate .2s}
select:open::picker-icon{rotate:180deg}
::picker(select){background:var(--card);color:var(--fg);border:1px solid var(--ac);border-radius:10px;padding:.25rem;margin-top:.25rem}
option{padding:.5rem .9rem;border-radius:6px;cursor:pointer}
option:hover,option:focus-visible{background:var(--bd)}
option:checked{background:var(--bt);color:var(--bf)}
select button{all:unset;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer}option{display:flex;align-items:center;gap:.5rem}option span{font-size:1.1rem}option::checkmark{content:"\2713";margin-inline-start:.75rem}
}
@media(prefers-reduced-motion:reduce){select::picker-icon{transition:none}}
</style>
</head>
<body>
<header><h1>🌿 Philosophy Quotes</h1>
<label>Theme <select id="theme"><button type="button"><selectedcontent></selectedcontent></button><option value="system"><span aria-hidden="true">💻</span> System</option><option value="light"><span aria-hidden="true">☀️</span> Light</option><option value="dark"><span aria-hidden="true">🌙</span> Dark</option></select></label></header>
<main id="cards"></main>
<hr>
<section id="wotd" aria-labelledby="wh"><h2 id="wh">Word of the Day</h2><div aria-live="polite">Loading…</div></section>
<script>
var Q={
"Stoicism":[
["The happiness of your life depends upon the quality of your thoughts.","Marcus Aurelius"],
["You have power over your mind, not outside events. Realize this, and you will find strength.","Marcus Aurelius"],
["The impediment to action advances action. What stands in the way becomes the way.","Marcus Aurelius"],
["We suffer more often in imagination than in reality.","Seneca"],
["It is not that we have a short time to live, but that we waste a lot of it.","Seneca"],
["Luck is what happens when preparation meets opportunity.","Seneca"],
["Difficulties strengthen the mind, as labor does the body.","Seneca"],
["It's not what happens to you, but how you react to it that matters.","Epictetus"],
["No man is free who is not master of himself.","Epictetus"],
["First say to yourself what you would be; and then do what you have to do.","Epictetus"],
["He who fears death will never do anything worthy of a living man.","Seneca"],
["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius"]],
"Taoism":[
["A journey of a thousand miles begins with a single step.","Lao Tzu"],
["Nature does not hurry, yet everything is accomplished.","Lao Tzu"],
["He who knows that enough is enough will always have enough.","Lao Tzu"],
["Knowing others is intelligence; knowing yourself is true wisdom.","Lao Tzu"],
["When I let go of what I am, I become what I might be.","Lao Tzu"],
["The softest thing in the universe overcomes the hardest.","Lao Tzu"],
["Be content with what you have; rejoice in the way things are.","Lao Tzu"],
["Happiness is the absence of the striving for happiness.","Zhuangzi"],
["Flow with whatever may happen and let your mind be free.","Zhuangzi"],
["The wise man does not lay up his own treasures. The more he gives to others, the more he has for his own.","Lao Tzu"],
["Care about people's approval and you will be their prisoner.","Lao Tzu"],
["To the mind that is still, the whole universe surrenders.","Lao Tzu"]],
"Zen Buddhism":[
["Before enlightenment, chop wood, carry water. After enlightenment, chop wood, carry water.","Zen proverb"],
["If you meet the Buddha on the road, kill him.","Linji Yixuan"],
["Fall seven times, stand up eight.","Japanese proverb"],
["When you reach the top of the mountain, keep climbing.","Zen proverb"],
["In the beginner's mind there are many possibilities, but in the expert's there are few.","Shunryu Suzuki"],
["Moment by moment, the world is created anew.","Zen saying"],
["The obstacle is the path.","Zen proverb"],
["Sitting quietly, doing nothing, spring comes, and the grass grows by itself.","Zen saying"],
["Do not seek the truth; only cease to cherish opinions.","Sengcan"],
["Nothing in the world is more flexible than water, yet nothing is stronger.","Zen saying"],
["The way is not in the sky. The way is in the heart.","Attributed to Buddha"],
["Let go or be dragged.","Zen proverb"]],
"Hindu Philosophy":[
["You have a right to your actions, but never to your actions' fruits.","Bhagavad Gita 2.47"],
["The soul is never born nor dies; it is unborn, eternal, ever-existing.","Bhagavad Gita 2.20"],
["Truth is one; the sages call it by many names.","Rig Veda 1.164.46"],
["Tat tvam asi: You are that.","Chandogya Upanishad"],
["Lead me from untruth to truth, from darkness to light, from death to immortality.","Brihadaranyaka Upanishad"],
["Yoga is skill in action.","Bhagavad Gita 2.50"],
["The mind is restless and difficult to restrain, but it is subdued by practice.","Bhagavad Gita 6.35"],
["One who sees inaction in action, and action in inaction, is wise.","Bhagavad Gita 4.18"],
["Man is made by his belief. As he believes, so he is.","Bhagavad Gita 17.3"],
["Aham Brahmasmi: I am Brahman.","Brihadaranyaka Upanishad"],
["The whole world is one family.","Maha Upanishad"],
["Arise, awake, and stop not till the goal is reached.","Swami Vivekananda (Katha Upanishad)"]]
};
var cards=document.getElementById("cards"),last={};
function pick(k){var a=Q[k],i;do{i=Math.random()*a.length|0}while(a.length>1&&i===last[k]);last[k]=i;return a[i]}
Object.keys(Q).forEach(function(k){
var a=document.createElement("article"),h=document.createElement("h2"),b=document.createElement("blockquote"),c=document.createElement("cite"),n=document.createElement("button");
h.textContent=k;n.textContent="New quote";n.type="button";b.setAttribute("aria-live","polite");
function show(){var q=pick(k);b.textContent="\u201C"+q[0]+"\u201D";c.textContent="\u2014 "+q[1];b.appendChild(c)}
n.onclick=show;show();a.append(h,b,n);cards.appendChild(a)});
(function(){
var d=document.querySelector("#wotd div");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;e.textContent=x;return e}
fetch("wotd.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(w){
d.textContent="";
d.append(el("p","w",w.word),el("p","m","/"+w.pron+"/ \u00B7 "+w.pos));
if(w.audio){var b=el("button","","\u{1F50A} Listen");b.type="button";b.setAttribute("aria-label","Listen to pronunciation of "+w.word);var au;b.onclick=function(){au=au||new Audio(w.audio);au.currentTime=0;au.play()};d.append(b)}
d.append(el("p","",w.def));
if(w.ex)d.append(el("p","m","\u201C"+w.ex+"\u201D"));
var l=el("a","",w.url?"Merriam-Webster \u2192":"");l.href=w.url;l.rel="noopener";d.append(l)
}).catch(function(){d.textContent="Word of the day is unavailable right now."})
})();
var s=document.getElementById("theme");s.value=localStorage.getItem("theme")||"system";
s.onchange=function(){var v=s.value,r=document.documentElement;if(v==="system"){localStorage.removeItem("theme");delete r.dataset.theme}else{localStorage.setItem("theme",v);r.dataset.theme=v}};
</script>
</body>
</html>
